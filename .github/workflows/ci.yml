name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # src-tauri depends on objc2 and objc2-app-kit unconditionally, and objc2
    # refuses to compile for a non-Apple target, so the Rust half can only be
    # checked on macOS. Runners are free here because the repository is public.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Typecheck and build the front end
        run: npm run build

      - name: Model-layer tests
        run: npm test

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
